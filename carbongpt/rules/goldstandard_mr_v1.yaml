standard: GoldStandard
doc_type: MR

rules:
  # -----------------------------------------------------------------------
  # Required sections — using actual GS MR heading names
  # -----------------------------------------------------------------------
  - id: GS_MR_001
    type: required_section
    section: "KEY PROJECT INFORMATION"
    severity: ERROR

  - id: GS_MR_002
    type: required_section
    section: "SECTION A"
    severity: ERROR

  - id: GS_MR_003
    type: required_section
    section: "SECTION B"
    severity: ERROR

  - id: GS_MR_004
    type: required_section
    section: "SECTION C"
    severity: ERROR

  - id: GS_MR_005
    type: required_section
    section: "SECTION D"
    severity: ERROR

  - id: GS_MR_006
    type: required_section
    section: "SECTION E"
    severity: ERROR

  - id: GS_MR_007
    type: required_section
    section: "SECTION F"
    severity: WARNING

  - id: GS_MR_008
    type: required_section
    section: "SECTION G"
    severity: WARNING

  # -----------------------------------------------------------------------
  # Required fields inside KEY PROJECT INFORMATION
  # -----------------------------------------------------------------------
  - id: GS_MR_F001
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "gs_id"
    severity: ERROR
    patterns:
      - "(?i)GS\\s*[-:]?\\s*\\d{3,}"
      - "(?i)gold\\s*standard\\s+id"
      - "(?i)GS\\s+ID"

  - id: GS_MR_F002
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "title_of_project"
    severity: ERROR
    patterns:
      - "(?i)title\\s+of\\s+(?:the\\s+)?project"
      - "(?i)project\\s+title"
      - "(?i)project\\s+name"

  - id: GS_MR_F003
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "version_number_monitoring_report"
    severity: ERROR
    patterns:
      - "(?i)version\\s+number\\s+of\\s+the\\s+monitoring\\s+report"
      - "(?i)version\\s+(?:number|no\\.?|#)?\\s*(?:of\\s+)?(?:the\\s+)?(?:monitoring|MR)"
      - "(?i)version\\s*[:.]?\\s*\\d+"
      - "(?i)v\\d+\\.\\d+"

  - id: GS_MR_F004
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "completion_date_monitoring_report"
    severity: ERROR
    patterns:
      - "(?i)completion\\s+date"
      - "(?i)date\\s+(?:of\\s+)?completion"
      - "\\d{2}/\\d{2}/\\d{4}"
      - "\\d{1,2}\\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{4}"

  - id: GS_MR_F005
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "monitoring_period_number"
    severity: ERROR
    patterns:
      - "(?i)monitoring\\s+period\\s+number"
      - "(?i)monitoring\\s+period\\s*(?:no\\.?|#)?\\s*[:.]?\\s*\\d+"
      - "(?i)(?:period|MP)\\s*#?\\s*\\d+"

  - id: GS_MR_F006
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "duration_monitoring_period"
    severity: ERROR
    patterns:
      - "(?i)duration\\s+of\\s+(?:this\\s+)?(?:monitoring\\s+)?period"
      - "(?i)duration\\s+(?:of\\s+)?(?:this\\s+)?monitoring\\s+period"
      - "\\d{2}/\\d{2}/\\d{4}\\s*[-–]\\s*\\d{2}/\\d{2}/\\d{4}"
      - "\\d{2}/\\d{2}/\\d{4}.*(?:to).*\\d{2}/\\d{2}/\\d{4}"
      - "(?i)from\\s+.*\\s+to\\s+"

  - id: GS_MR_F007
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "host_country"
    severity: ERROR
    patterns:
      - "(?i)host\\s+country"

  - id: GS_MR_F008
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "methodology_and_version"
    severity: ERROR
    patterns:
      - "(?i)methodolog(?:y|ies)\\s+.*version"
      - "(?i)methodolog(?:y|ies)\\s+(?:applied|used)"
      - "(?i)methodolog(?:y|ies)\\s*\\(\\s*ies\\s*\\)\\s+applied"
      - "(?i)(?:AMS|ACM|AM)[-\\s]?[IVX]*[-\\.]?\\d+"

  # -----------------------------------------------------------------------
  # Emissions-related field checks in relevant sections
  # -----------------------------------------------------------------------
  - id: GS_MR_F009
    type: required_field
    section: "SECTION E"
    field_name: "baseline_estimate"
    severity: ERROR
    patterns:
      - "(?i)baseline\\s+(?:emissions?|estimate|value|situation)"
      - "(?i)calculation\\s+of\\s+baseline"

  - id: GS_MR_F010
    type: required_field
    section: "SECTION E"
    field_name: "project_estimate"
    severity: ERROR
    patterns:
      - "(?i)project\\s+(?:emissions?|estimate|value|situation)"
      - "(?i)calculation\\s+of\\s+project"

  - id: GS_MR_F011
    type: required_field
    section: "SECTION E"
    field_name: "emission_reductions"
    severity: ERROR
    patterns:
      - "(?i)emission\\s+reductions?"
      - "(?i)net\\s+benefit"
      - "(?i)calculation\\s+of\\s+(?:net|emission)"

  # -----------------------------------------------------------------------
  # Date format checks (DD/MM/YYYY required)
  # -----------------------------------------------------------------------
  - id: GS_MR_D001
    type: date_format_ddmmyyyy
    section: "KEY PROJECT INFORMATION"
    severity: WARNING
    date_patterns:
      - "\\d{4}-\\d{2}-\\d{2}"
      - "\\d{2}-\\d{2}-\\d{4}"
      - "\\d{2}/\\d{2}/\\d{4}"

  # -----------------------------------------------------------------------
  # Must-mention keyword checks
  # -----------------------------------------------------------------------
  - id: GS_MR_K001
    type: must_mention_keywords
    section: "SECTION D"
    severity: ERROR
    keywords: ["sampling", "random", "sample size", "representative"]
    min_hits: 2

  - id: GS_MR_K002
    type: must_mention_keywords
    section: "SECTION D"
    severity: ERROR
    keywords: ["90/10", "confidence", "precision"]
    min_hits: 1

  - id: GS_MR_K003
    type: must_mention_keywords
    section: "SECTION D"
    severity: WARNING
    keywords: ["KPT", "Kitchen Performance Test"]
    min_hits: 1

  - id: GS_MR_K004
    type: must_mention_keywords
    section: "SECTION C"
    severity: ERROR
    keywords: ["data source", "spreadsheet", "database"]
    min_hits: 1

  - id: GS_MR_K005
    type: must_mention_keywords
    section: "SECTION F"
    severity: ERROR
    keywords: ["grievance", "complaint", "stakeholder"]
    min_hits: 1

  # -----------------------------------------------------------------------
  # Not-applicable when blank
  # -----------------------------------------------------------------------
  - id: GS_MR_NA001
    type: not_applicable_required_when_blank
    section: "SECTION F"
    severity: WARNING
    min_chars: 40

  - id: GS_MR_NA002
    type: not_applicable_required_when_blank
    section: "SECTION G"
    severity: WARNING
    min_chars: 40
