standard: GoldStandard
doc_type: MR

rules:
  # -----------------------------------------------------------------------
  # Required sections
  # -----------------------------------------------------------------------
  - id: GS_MR_001
    type: required_section
    section: "KEY PROJECT INFORMATION"
    severity: ERROR

  - id: GS_MR_002
    type: required_section
    section: "Project Description"
    severity: ERROR

  - id: GS_MR_003
    type: required_section
    section: "Monitoring Period"
    severity: ERROR

  - id: GS_MR_004
    type: required_section
    section: "Baseline Emissions"
    severity: ERROR

  - id: GS_MR_005
    type: required_section
    section: "Project Emissions"
    severity: ERROR

  - id: GS_MR_006
    type: required_section
    section: "Emission Reductions"
    severity: ERROR

  - id: GS_MR_007
    type: required_section
    section: "Data Quality"
    severity: WARNING

  - id: GS_MR_008
    type: required_section
    section: "Safeguards"
    severity: WARNING

  # -----------------------------------------------------------------------
  # Required fields inside KEY PROJECT INFORMATION
  # -----------------------------------------------------------------------
  - id: GS_MR_F001
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "gs_id"
    severity: ERROR
    patterns:
      - "(?i)GS\\s*[-:]?\\s*\\d{3,}"
      - "(?i)gold\\s*standard\\s+id"
      - "(?i)GS\\s+ID"

  - id: GS_MR_F002
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "title_of_project"
    severity: ERROR
    patterns:
      - "(?i)title\\s+of\\s+(?:the\\s+)?project"
      - "(?i)project\\s+title"
      - "(?i)project\\s+name"

  - id: GS_MR_F003
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "version_number_monitoring_report"
    severity: ERROR
    patterns:
      - "(?i)version\\s*(?:number|no\\.?|#)?\\s*[:.]?\\s*\\d+"
      - "(?i)v\\d+\\.\\d+"
      - "(?i)monitoring\\s+report\\s+version"

  - id: GS_MR_F004
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "completion_date_monitoring_report"
    severity: ERROR
    patterns:
      - "(?i)completion\\s+date"
      - "(?i)date\\s+(?:of\\s+)?completion"
      - "\\d{2}/\\d{2}/\\d{4}"
      - "\\d{1,2}\\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{4}"

  - id: GS_MR_F005
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "monitoring_period_number"
    severity: ERROR
    patterns:
      - "(?i)monitoring\\s+period\\s*(?:number|no\\.?|#)?\\s*[:.]?\\s*\\d+"
      - "(?i)(?:period|MP)\\s*#?\\s*\\d+"

  - id: GS_MR_F006
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "duration_monitoring_period"
    severity: ERROR
    patterns:
      - "(?i)duration\\s+(?:of\\s+)?(?:this\\s+)?(?:monitoring\\s+)?period"
      - "\\d{2}/\\d{2}/\\d{4}\\s*[-–to]+\\s*\\d{2}/\\d{2}/\\d{4}"
      - "\\d{4}-\\d{2}-\\d{2}\\s*[-–to]+\\s*\\d{4}-\\d{2}-\\d{2}"
      - "(?i)from\\s+.*\\s+to\\s+"

  - id: GS_MR_F007
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "host_country"
    severity: ERROR
    patterns:
      - "(?i)host\\s+country"
      - "(?i)country\\s*[:.]?\\s*\\w+"
      - "(?i)\\b(?:Kenya|India|China|Brazil|Indonesia|Uganda|Rwanda|Ethiopia|Nepal|Vietnam|Bangladesh|Colombia|Peru|Mexico|Ghana|Tanzania|Mozambique|Cambodia|Myanmar|Philippines|Thailand|South Africa|Nigeria)\\b"

  - id: GS_MR_F008
    type: required_field
    section: "KEY PROJECT INFORMATION"
    field_name: "methodology_and_version"
    severity: ERROR
    patterns:
      - "(?i)methodology\\s+(?:applied|used|version)"
      - "(?i)(?:AMS|ACM|AM)[-\\s]?[IVX]*[-\\.]?\\d+"
      - "(?i)methodology\\s*[:.]?\\s*\\w+"
      - "(?i)version\\s*(?:number|no\\.?)?\\s*[:.]?\\s*\\d+"

  # -----------------------------------------------------------------------
  # Date format checks (DD/MM/YYYY required)
  # -----------------------------------------------------------------------
  - id: GS_MR_D001
    type: date_format_ddmmyyyy
    section: "KEY PROJECT INFORMATION"
    severity: WARNING
    date_patterns:
      - "\\d{4}-\\d{2}-\\d{2}"
      - "\\d{2}-\\d{2}-\\d{4}"
      - "\\d{2}/\\d{2}/\\d{4}"

  - id: GS_MR_D002
    type: date_format_ddmmyyyy
    section: "Monitoring Period"
    severity: WARNING
    date_patterns:
      - "\\d{4}-\\d{2}-\\d{2}"
      - "\\d{2}-\\d{2}-\\d{4}"
      - "\\d{2}/\\d{2}/\\d{4}"

  # -----------------------------------------------------------------------
  # Not-applicable when blank
  # -----------------------------------------------------------------------
  - id: GS_MR_NA001
    type: not_applicable_required_when_blank
    section: "Data Quality"
    severity: WARNING
    min_chars: 40

  - id: GS_MR_NA002
    type: not_applicable_required_when_blank
    section: "Safeguards"
    severity: WARNING
    min_chars: 40
